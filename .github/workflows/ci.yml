name: AXM Nexus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1 & 2: Backend Compilation & Tests
  # ============================================================================
  backend-checks:
    name: Backend Build & Tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Compile Backend Classes
        run: ./gradlew assemble -x test --no-daemon
        working-directory: ./backend

      - name: Run Backend Unit & Integration Tests
        run: ./gradlew test --no-daemon
        working-directory: ./backend

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test/
          retention-days: 7

  # ============================================================================
  # 3, 4, 5 & 6: Frontend TypeCheck, Lint, Tests & Production Build
  # ============================================================================
  frontend-checks:
    name: Frontend Lint, TypeCheck, Tests & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Run TypeScript Type Check
        run: npx tsc -b
        working-directory: ./frontend

      - name: Run Frontend Tests (Vitest)
        run: npm test -- --run
        working-directory: ./frontend

      - name: Build Production Frontend Assets
        run: npm run build
        working-directory: ./frontend

  # ============================================================================
  # 7: Dependency & Secret Scanning
  # ============================================================================
  security-scan:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: NPM Dependency Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # ============================================================================
  # 8: Container Build Verification
  # ============================================================================
  container-verification:
    name: Container Build Verification
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: axm-nexus-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: axm-nexus-frontend:ci-check
