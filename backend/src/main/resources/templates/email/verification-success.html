<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Muvaffaqiyatli Tasdiqlandi — AXM Nexus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10b981;
            font-size: 36px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px;
            color: #ffffff;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin: 0 0 28px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .footer-note {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Email Manzili Tasdiqlandi!</h1>
        <p>
            Hurmatli <strong th:text="${userName}">Foydalanuvchi</strong>, sizning elektron pochta manzilingiz (<span th:text="${userEmail}">email</span>) muvaffaqiyatli faollashtirildi. Endi siz AXM Nexus tizimidan to'liq foydalanishingiz mumkin.
        </p>
        <a th:href="${appUrl}" class="btn">Platformaga O'tish</a>
        <div class="footer-note">
            AXM Nexus • Muhammad Al-Xorazmiy Vorislari ta'lim tizimi
        </div>
    </div>
</body>
</html>
