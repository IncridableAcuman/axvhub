server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: nexus-backend

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:axvhub}
    username: ${DB_USER:izzatbek}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
        concurrency: 1
        max-concurrency: 3
        default-requeue-rejected: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${APP_JWT_SECRET:axm_nexus_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security_reasons_12345}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@axm-nexus.uz}}
    sender-name: "AXM Nexus Ta'lim Tizimi"
    verification-url: ${APP_BASE_URL:http://localhost:5173}/auth/verify-email
    token-expiration-minutes: 1440
    rate-limit:
      cooldown-seconds: ${MAIL_COOLDOWN_SECONDS:60}
      max-per-hour: ${MAIL_MAX_PER_HOUR:5}
  rabbitmq:
    email-exchange: axm.nexus.email.exchange
    email-verification-queue: axm.nexus.email.verification.queue
    email-verification-routing-key: axm.nexus.email.verification.key
  ai:
    active-provider: ${AI_PROVIDER:groq}
    timeout-ms: 30000
    max-retries: 3
    max-tokens: 2048
    rate-limit-per-minute: 30
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
